[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualkit"
version = "2.1.0"
description = "A programmable video-editing engine: timelines, compound clips, and code-rendered (HTML/CSS/JS) visuals, exportable to video or DaVinci Resolve."
readme = "README.md"
authors = [{ name = "Suraj Airi", email = "surajairi.ml@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "video",
    "editing",
    "timeline",
    "ffmpeg",
    "davinci-resolve",
    "fcpxml",
    "xmeml",
    "infographics",
]
classifiers = [
    "Development Status :: 2.1.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.13.5"]

[project.optional-dependencies]
# Deterministic frame capture for *animated* coded visuals. VisualKit drives the
# Chrome/Chromium you already have installed; this does not download a browser.
render = ["playwright>=1.40"]

[dependency-groups]
dev = [
    "notebook>=7.6.2",
    "pyperclip>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.40",
    "pillow>=10.0",
    "ruff>=0.12.1",
    "mkdocs-material>=9.7.7",
]
docs = ["mkdocs-material>=9.7.7"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
visualkit = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: drives a real headless Chrome/Chromium (skipped when none is installed)",
]


[project.urls]
Homepage = "https://surajairi.github.io/visualkit/"
Documentation = "https://surajairi.github.io/visualkit/"
Repository = "https://github.com/surajairi/visualkit"
Issues = "https://github.com/surajairi/visualkit/issues"
